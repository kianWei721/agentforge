spring:
  application:
    name: agentforge

server:
  port: ${SERVER_PORT:8080}

agentforge:
  model:
    provider: ${AGENTFORGE_MODEL_PROVIDER:mock}
    mock:
      model: mock-stream-v0
      delay-millis: 120
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:}
      model: ${DASHSCOPE_MODEL:qwen-plus}
  agent:
    enabled: ${AGENTFORGE_AGENT_ENABLED:false}
    name: agentforge-assistant
    system-prompt: >-
      你是 AgentForge 企业智能体平台中的助手。回答准确、简洁。
      当用户询问设备状态时，必须优先调用 query_device_status 工具获取数据，不要臆测设备状态。
      当前 V0.2 仅开放 AgentForge 显式注册的业务工具，不开放文件、Shell、动态技能和子 Agent 工具。

management:
  endpoints:
    web:
      exposure:
        include: health,info
