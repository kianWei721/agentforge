spring:
  application:
    name: agentforge
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:10}
      minimum-idle: ${MYSQL_MIN_IDLE:2}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}

agentforge:
  model:
    provider: ${AGENTFORGE_MODEL_PROVIDER:mock}
    mock:
      model: mock-stream-v0
      delay-millis: 120
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:}
      model: ${DASHSCOPE_MODEL:qwen3.8-flash}
  model-gateway:
    # Off by default. When on, knowledge query rewrite and answerability go through the gateway
    # with no direct DashScope fallback; AGENTFORGE_MODEL_PROVIDER=gateway routes chat as well.
    # An agent goes through the gateway when its definition says model-provider=gateway and names
    # the route as its model (e.g. "agent"). Embedding and rerank still call DashScope directly.
    enabled: ${AGENTFORGE_MODEL_GATEWAY_ENABLED:false}
    base-url: ${AGENTFORGE_MODEL_GATEWAY_BASE_URL:http://localhost:8090/v1}
    api-key: ${AGENTFORGE_MODEL_GATEWAY_API_KEY:}
    rag-route: ${AGENTFORGE_MODEL_GATEWAY_RAG_ROUTE:rag-json}
    chat-route: ${AGENTFORGE_MODEL_GATEWAY_CHAT_ROUTE:standard}
    connect-timeout: 3s
    request-timeout: ${AGENTFORGE_MODEL_GATEWAY_REQUEST_TIMEOUT:30s}
    agent-max-tokens: ${AGENTFORGE_MODEL_GATEWAY_AGENT_MAX_TOKENS:2048}
    agent-request-timeout: ${AGENTFORGE_MODEL_GATEWAY_AGENT_REQUEST_TIMEOUT:40s}
  channel:
    wecom:
      # WeCom smart bot over HTTP callbacks (POST/GET /callbacks/wecom/bot). Off by default.
      enabled: ${AGENTFORGE_WECOM_ENABLED:false}
      token: ${AGENTFORGE_WECOM_TOKEN:}
      encoding-aes-key: ${AGENTFORGE_WECOM_ENCODING_AES_KEY:}
      # Blank skips the receive id check after decryption.
      receive-id: ${AGENTFORGE_WECOM_RECEIVE_ID:}
      bot-id: ${AGENTFORGE_WECOM_BOT_ID:}
      # A dedicated agent; it may only use these read-only, ACL-filtered tools.
      agent-id: ${AGENTFORGE_WECOM_AGENT_ID:}
      allowed-tools: search_knowledge
      # wecomUserId=agentforgeUserId, comma separated
      direct-users: ${AGENTFORGE_WECOM_DIRECT_USERS:}
      # chatId=wecom-group:<name>; register that user under agentforge.security.principals
      groups: ${AGENTFORGE_WECOM_GROUPS:}
      allow-staff-groups: false
      max-concurrent-turns: 4
      # Memory bound only: admission by deadline decides what is accepted.
      max-pending-turns: 1000
      max-queued-per-session: 3
      # Starting guess for how long one turn takes; real durations replace it as they come in.
      # Admission refuses a message at once when it would only finish after WeCom stops pulling.
      expected-turn-duration: 15s
      turn-timeout: 5m
      stream-ttl: 10m
      timestamp-tolerance: 5m
      # Intent routing (V0.12). Phrases decide on arrival; with model-stage, a classifier through
      # the model gateway decides the rest. Whatever is unclear goes to the default intent, which
      # the agent answers. Names are recorded in af_channel_inbound and in metrics: keep them stable.
      intent:
        enabled: ${AGENTFORGE_WECOM_INTENT_ENABLED:false}
        model-stage: ${AGENTFORGE_WECOM_INTENT_MODEL_STAGE:false}
        model-route: ${AGENTFORGE_WECOM_INTENT_MODEL_ROUTE:rag-json}
        default-intent: answer
        timeout: 3s
        min-confidence: 0.7
        max-input-chars: 500
        intents:
          - name: answer
            description: 可以从知识库回答的业务咨询，例如政策、办事流程、需要准备的资料、产品和服务说明，以及对前面回答的追问
            target: answer
          - name: handoff
            description: 必须由人处理的诉求，例如明确要求人工、投诉、表达强烈不满、要求退款或改动自己的账户和订单
            target: handoff
            # Matched as plain substrings, so keep them specific: a negation such as "不用转人工" also matches.
            keywords: [转人工, 人工客服, 找人工, 投诉]
            # Nobody is notified: the reply must not claim a person is on the way.
            reply: 已登记，请直接联系群里的客服同事。
          - name: out_of_scope
            description: 与业务无关的请求，例如闲聊、娱乐、写代码、写作业、翻译与业务无关的内容
            target: refuse
            reply: 这个问题不在我能回答的范围内，可以问我业务相关的问题。
  knowledge:
    hybrid:
      enabled: ${AGENTFORGE_KNOWLEDGE_HYBRID_ENABLED:false}
      candidate-multiplier: ${AGENTFORGE_KNOWLEDGE_CANDIDATE_MULTIPLIER:4}
      rrf-k: ${AGENTFORGE_KNOWLEDGE_RRF_K:60}
      max-candidates: ${AGENTFORGE_KNOWLEDGE_MAX_CANDIDATES:100000}
      relevance-gate-enabled: ${AGENTFORGE_KNOWLEDGE_RELEVANCE_GATE_ENABLED:true}
      min-vector-similarity: ${AGENTFORGE_KNOWLEDGE_MIN_VECTOR_SIMILARITY:0.60}
      embedding:
        base-url: ${AGENTFORGE_KNOWLEDGE_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${AGENTFORGE_KNOWLEDGE_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
        model: ${AGENTFORGE_KNOWLEDGE_EMBEDDING_MODEL:text-embedding-v4}
        dimensions: ${AGENTFORGE_KNOWLEDGE_EMBEDDING_DIMENSIONS:1024}
        batch-size: ${AGENTFORGE_KNOWLEDGE_EMBEDDING_BATCH_SIZE:10}
        request-timeout: ${AGENTFORGE_KNOWLEDGE_EMBEDDING_REQUEST_TIMEOUT:15s}
      elasticsearch:
        base-url: ${AGENTFORGE_KNOWLEDGE_ES_BASE_URL:}
        index-name: ${AGENTFORGE_KNOWLEDGE_ES_INDEX:agentforge-knowledge-v1}
        username: ${AGENTFORGE_KNOWLEDGE_ES_USERNAME:}
        password: ${AGENTFORGE_KNOWLEDGE_ES_PASSWORD:}
        api-key: ${AGENTFORGE_KNOWLEDGE_ES_API_KEY:}
        connect-timeout: ${AGENTFORGE_KNOWLEDGE_ES_CONNECT_TIMEOUT:2s}
        request-timeout: ${AGENTFORGE_KNOWLEDGE_ES_REQUEST_TIMEOUT:5s}
    query-rewrite:
      enabled: ${AGENTFORGE_KNOWLEDGE_QUERY_REWRITE_ENABLED:false}
      base-url: ${AGENTFORGE_KNOWLEDGE_QUERY_REWRITE_BASE_URL:${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      api-key: ${AGENTFORGE_KNOWLEDGE_QUERY_REWRITE_API_KEY:${DASHSCOPE_API_KEY:}}
      model: ${AGENTFORGE_KNOWLEDGE_QUERY_REWRITE_MODEL:${DASHSCOPE_MODEL:qwen3.8-flash}}
      request-timeout: ${AGENTFORGE_KNOWLEDGE_QUERY_REWRITE_REQUEST_TIMEOUT:15s}
      max-query-chars: ${AGENTFORGE_KNOWLEDGE_QUERY_REWRITE_MAX_QUERY_CHARS:512}
    rerank:
      enabled: ${AGENTFORGE_KNOWLEDGE_RERANK_ENABLED:false}
      base-url: ${AGENTFORGE_KNOWLEDGE_RERANK_BASE_URL:}
      api-key: ${AGENTFORGE_KNOWLEDGE_RERANK_API_KEY:}
      model: ${AGENTFORGE_KNOWLEDGE_RERANK_MODEL:qwen3-rerank}
      candidate-limit: ${AGENTFORGE_KNOWLEDGE_RERANK_CANDIDATE_LIMIT:8}
      request-timeout: ${AGENTFORGE_KNOWLEDGE_RERANK_REQUEST_TIMEOUT:15s}
    evaluation:
      enabled: ${AGENTFORGE_KNOWLEDGE_EVALUATION_ENABLED:false}
      index-name: ${AGENTFORGE_KNOWLEDGE_EVALUATION_INDEX:agentforge-knowledge-eval-v070}
      dataset-resource: ${AGENTFORGE_KNOWLEDGE_EVALUATION_DATASET:classpath:knowledge/eval/v070-gold-dataset-v3.json}
      top-k: ${AGENTFORGE_KNOWLEDGE_EVALUATION_TOP_K:5}
      rrf-k-values: ${AGENTFORGE_KNOWLEDGE_EVALUATION_RRF_K_VALUES:5,20,60,120}
    answerability:
      enabled: ${AGENTFORGE_KNOWLEDGE_ANSWERABILITY_ENABLED:false}
      base-url: ${AGENTFORGE_KNOWLEDGE_ANSWERABILITY_BASE_URL:${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      api-key: ${AGENTFORGE_KNOWLEDGE_ANSWERABILITY_API_KEY:${DASHSCOPE_API_KEY:}}
      model: ${AGENTFORGE_KNOWLEDGE_ANSWERABILITY_MODEL:${DASHSCOPE_MODEL:qwen3.8-flash}}
      candidate-limit: ${AGENTFORGE_KNOWLEDGE_ANSWERABILITY_CANDIDATE_LIMIT:8}
      request-timeout: ${AGENTFORGE_KNOWLEDGE_ANSWERABILITY_REQUEST_TIMEOUT:20s}
  iot:
    lure-lamp-control:
      enabled: ${AGENTFORGE_IOT_LURE_LAMP_CONTROL_ENABLED:false}
      latest-properties-path: "${AGENTFORGE_IOT_LURE_LAMP_LATEST_PROPERTIES_PATH:/api/iot/devices/{deviceId}/properties/latest}"
      command-path: "${AGENTFORGE_IOT_LURE_LAMP_COMMAND_PATH:/api/iot/device-commands}"
      request-timeout: ${AGENTFORGE_IOT_LURE_LAMP_REQUEST_TIMEOUT:3s}
      verify-attempts: ${AGENTFORGE_IOT_LURE_LAMP_VERIFY_ATTEMPTS:10}
      verify-interval: ${AGENTFORGE_IOT_LURE_LAMP_VERIFY_INTERVAL:500ms}
    device-status:
      mode: ${AGENTFORGE_IOT_DEVICE_STATUS_MODE:demo}
      base-url: ${AGENTFORGE_IOT_BASE_URL:}
      detail-path: "${AGENTFORGE_IOT_DEVICE_DETAIL_PATH:/api/iot/devices/{deviceId}}"
      details-path: "${AGENTFORGE_IOT_DEVICE_DETAILS_PATH:/api/iot/devices/{deviceId}/details}"
      events-history-path: "${AGENTFORGE_IOT_DEVICE_EVENTS_HISTORY_PATH:/api/iot/devices/{deviceId}/events/history}"
      access-token: ${AGENTFORGE_IOT_ACCESS_TOKEN:}
      tenant-id: ${AGENTFORGE_IOT_TENANT_ID:}
      connect-timeout: ${AGENTFORGE_IOT_CONNECT_TIMEOUT:2s}
      request-timeout: ${AGENTFORGE_IOT_REQUEST_TIMEOUT:3s}
      max-attempts: ${AGENTFORGE_IOT_MAX_ATTEMPTS:2}
      retry-backoff: ${AGENTFORGE_IOT_RETRY_BACKOFF:150ms}
      circuit-breaker-failure-threshold: ${AGENTFORGE_IOT_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-breaker-open-duration: ${AGENTFORGE_IOT_CIRCUIT_OPEN_DURATION:30s}
  tool-confirmation:
    ttl: ${AGENTFORGE_TOOL_CONFIRMATION_TTL:5m}
  tool-policy:
    enabled: ${AGENTFORGE_TOOL_POLICY_ENABLED:true}
    require-confirmation-for-write-tools: ${AGENTFORGE_TOOL_POLICY_CONFIRM_WRITE:true}
    require-confirmation-for-high-risk-read-only: ${AGENTFORGE_TOOL_POLICY_CONFIRM_HIGH_RISK_READ:true}
  tool-governance:
    enabled: ${AGENTFORGE_TOOL_GOVERNANCE_ENABLED:true}
    block-repeated-non-retryable-calls: ${AGENTFORGE_TOOL_GOVERNANCE_BLOCK_REPEATED_NON_RETRYABLE:true}
    max-recorded-invocations: ${AGENTFORGE_TOOL_GOVERNANCE_MAX_RECORDED_INVOCATIONS:256}
  retrieval-budget:
    enabled: ${AGENTFORGE_RETRIEVAL_BUDGET_ENABLED:true}
    max-calls-per-execution: ${AGENTFORGE_RETRIEVAL_BUDGET_MAX_CALLS_PER_EXECUTION:3}
  session-cache:
    enabled: ${AGENTFORGE_SESSION_CACHE_ENABLED:true}
    key-prefix: ${AGENTFORGE_SESSION_CACHE_PREFIX:agentforge:session:}
    ttl: ${AGENTFORGE_SESSION_CACHE_TTL:24h}
    restore-max-messages: ${AGENTFORGE_CONTEXT_RESTORE_MAX_MESSAGES:40}
  security:
    # The trusted gateway authenticates the caller and injects X-AgentForge-User-Id. These lists
    # decide what that user is; unknown users get 401. No defaults on purpose.
    principals:
      staff-user-ids: ${AGENTFORGE_STAFF_USER_IDS:}
      # userId=customerId, comma separated
      customer-users: ${AGENTFORGE_CUSTOMER_USERS:}
  agent:
    enabled: ${AGENTFORGE_AGENT_ENABLED:false}
    name: agentforge-assistant
    system-prompt: >-
      你是 AgentForge 企业智能体平台中的助手。回答准确、简洁。
      当用户询问设备状态时，必须优先调用 query_device_status 工具获取数据，不要臆测设备状态。
      当工具明确返回 AUTHENTICATION_FAILED、FORBIDDEN、BAD_REQUEST 等不可重试错误时，
      不要使用完全相同的参数重复调用同一工具。
      当前 V0.5 仅开放 AgentForge 显式注册的业务工具，不开放文件、Shell、动态技能和子 Agent 工具。
    # The agent runtime keeps per-session caches it never evicts; a new generation replaces it
    # after this many turns (state is reloaded from the store each turn, so nothing is lost).
    runtime-generation-turns: ${AGENTFORGE_AGENT_RUNTIME_GENERATION_TURNS:5000}
    memory:
      # AgentScope's root directory; conversation content is never written here.
      workspace: ${AGENTFORGE_AGENT_WORKSPACE:}
      # Compact a long session at whichever comes first; keep the most recent messages verbatim.
      compaction-trigger-messages: 50
      compaction-trigger-tokens: 12000
      compaction-keep-messages: 20
      summary-max-chars: 800

management:
  endpoints:
    web:
      exposure:
        # /actuator is not behind the identity filter: add metrics only where it is not public.
        include: ${AGENTFORGE_ACTUATOR_EXPOSURE:health,info}
