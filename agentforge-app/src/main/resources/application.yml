spring:
  application:
    name: agentforge
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:10}
      minimum-idle: ${MYSQL_MIN_IDLE:2}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}

agentforge:
  model:
    provider: ${AGENTFORGE_MODEL_PROVIDER:mock}
    mock:
      model: mock-stream-v0
      delay-millis: 120
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:}
      model: ${DASHSCOPE_MODEL:qwen3.8-flash}
  iot:
    device-status:
      mode: ${AGENTFORGE_IOT_DEVICE_STATUS_MODE:demo}
      base-url: ${AGENTFORGE_IOT_BASE_URL:}
      detail-path: "${AGENTFORGE_IOT_DEVICE_DETAIL_PATH:/admin-api/device/web/devices/{deviceId}}"
      access-token: ${AGENTFORGE_IOT_ACCESS_TOKEN:}
      tenant-id: ${AGENTFORGE_IOT_TENANT_ID:}
      connect-timeout: ${AGENTFORGE_IOT_CONNECT_TIMEOUT:2s}
      request-timeout: ${AGENTFORGE_IOT_REQUEST_TIMEOUT:3s}
      max-attempts: ${AGENTFORGE_IOT_MAX_ATTEMPTS:2}
      retry-backoff: ${AGENTFORGE_IOT_RETRY_BACKOFF:150ms}
      circuit-breaker-failure-threshold: ${AGENTFORGE_IOT_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-breaker-open-duration: ${AGENTFORGE_IOT_CIRCUIT_OPEN_DURATION:30s}
  session-cache:
    enabled: ${AGENTFORGE_SESSION_CACHE_ENABLED:true}
    key-prefix: ${AGENTFORGE_SESSION_CACHE_PREFIX:agentforge:session:}
    ttl: ${AGENTFORGE_SESSION_CACHE_TTL:24h}
    restore-max-messages: ${AGENTFORGE_CONTEXT_RESTORE_MAX_MESSAGES:40}
  agent:
    enabled: ${AGENTFORGE_AGENT_ENABLED:false}
    name: agentforge-assistant
    system-prompt: >-
      你是 AgentForge 企业智能体平台中的助手。回答准确、简洁。
      当用户询问设备状态时，必须优先调用 query_device_status 工具获取数据，不要臆测设备状态。
      当前 V0.3 仅开放 AgentForge 显式注册的业务工具，不开放文件、Shell、动态技能和子 Agent 工具。

management:
  endpoints:
    web:
      exposure:
        include: health,info
