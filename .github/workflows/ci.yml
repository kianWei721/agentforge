name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject known private integration markers
        shell: bash
        run: |
          set -euo pipefail
          pattern='60\.12\.4\.180|/admin-api/device/web|deviceId[[:space:]]*=[[:space:]]*(373|367)|commandId[[:space:]]*=[[:space:]]*(2881|2883)'
          if git grep -nE "$pattern" -- . ':!PUBLIC_RELEASE.md'; then
            echo "Public-release marker scan failed."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven test
        run: mvn -B -ntp clean test

      - name: Parse promotion PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/promote-rag-v070.ps1",
            "scripts/rollback-rag-v070.ps1",
            "scripts/verify-rag-promotion-v070.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              exit 1
            }
          }

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
